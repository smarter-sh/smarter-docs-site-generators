# The lint standard of the repository: see skills/smarter-code-quality.
# Install the commit-msg hook too, so that commitlint checks each commit message.
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        exclude: '\.svg$|package-lock\.json$'
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
  - repo: https://github.com/PyCQA/isort
    rev: 10.0.0b1
    hooks:
      - id: isort
  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: [--py310-plus]
  # Prettier and ESLint run from node_modules, at the versions in package.json, so that the hooks and CI
  # (.github/workflows/test.yml) format the same way.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write --ignore-unknown --no-error-on-unmatched-pattern
        language: system
        types: [text]
      - id: eslint
        name: eslint
        entry: npx eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [javascript]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: forbid-new-submodules
      - id: trailing-whitespace
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  autofix_prs: true
  autoupdate_schedule: weekly
  skip: [eslint, commitlint]
