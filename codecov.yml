#------------------------------------------------------------------------------
# Codecov configuration
#
# .github/workflows/test.yml uploads one report per package, each with its own
# flag: docusaurus/coverage/lcov.info (Vitest), coverage/mkdocs.xml and
# coverage/sphinx.xml (pytest-cov). The README's badges show each flag.
#
# - project: a commit fails if it lowers a package's coverage by more than 1%
#   from its base. `make test` separately enforces 95% per package.
# - patch: the lines a pull request adds or changes need 90% coverage.
#------------------------------------------------------------------------------
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 90%

flags:
  docusaurus:
    paths:
      - docusaurus/src/
  mkdocs:
    paths:
      - mkdocs/src/
  sphinx:
    paths:
      - sphinx/src/

# Vitest writes paths relative to docusaurus/.
fixes:
  - "src/index.js::docusaurus/src/index.js"

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  require_changes: true
