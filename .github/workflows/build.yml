---
#------------------------------------------------------------------------------
# Build every package, as `make build` does: the Docusaurus plugin's npm
# tarball, and the MkDocs plugin's and the Sphinx extension's sdists and
# wheels. Publishing is done by hand, with `make publish`.
#------------------------------------------------------------------------------
name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, alpha, beta]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          node-version: "24"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          mkdir -p build
          cd docusaurus && npm pack --pack-destination ../build && cd ..
          python -m build --outdir build mkdocs
          python -m build --outdir build sphinx
          ls build
